<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ───────────── HEADER ───────────── -->
  <header>
    <div id="datetime">
      <span id="time"></span>
      <span id="date"></span>
    </div>
    <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
  </header>

  <!-- ───────────── GREETING ───────────── -->
  <section class="card greeting-card">
    <h1 id="greeting"></h1>
    <div class="name-row">
      <input id="name-input" type="text" placeholder="Enter your name…" maxlength="30" />
      <button id="name-save">Save</button>
    </div>
  </section>

  <!-- ───────────── MAIN GRID ───────────── -->
  <main class="grid">

    <!-- FOCUS TIMER -->
    <section class="card timer-card">
      <h2>Focus Timer</h2>
      <div id="timer-display">25:00</div>
      <div class="timer-settings">
        <label for="custom-minutes">Minutes:</label>
        <input id="custom-minutes" type="number" min="1" max="90" value="25" />
        <button id="set-time">Set</button>
      </div>
      <div class="timer-controls">
        <button id="timer-start">Start</button>
        <button id="timer-stop" disabled>Stop</button>
        <button id="timer-reset">Reset</button>
      </div>
      <p id="timer-status"></p>
    </section>

    <!-- TO-DO LIST -->
    <section class="card todo-card">
      <h2>To-Do List</h2>
      <div class="todo-input-row">
        <input id="todo-input" type="text" placeholder="Add a task…" maxlength="100" />
        <button id="todo-add">Add</button>
      </div>
      <div class="todo-toolbar">
        <label for="sort-select">Sort:</label>
        <select id="sort-select">
          <option value="default">Default</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="done">Done last</option>
        </select>
      </div>
      <ul id="todo-list"></ul>
    </section>

    <!-- QUICK LINKS -->
    <section class="card links-card">
      <h2>Quick Links</h2>
      <div class="link-input-row">
        <input id="link-label" type="text" placeholder="Label" maxlength="20" />
        <input id="link-url" type="url" placeholder="https://…" />
        <button id="link-add">Add</button>
      </div>
      <div id="links-grid"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
